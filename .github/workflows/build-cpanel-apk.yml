name: Build Cpanel APK

on:
  push:
    branches: [ main ]
    paths:
      - 'cpanel/**'
      - '.github/workflows/build-cpanel-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'cpanel/package-lock.json'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar dependencias
        run: |
          cd cpanel
          npm install --legacy-peer-deps

      - name: Compilar Web (Vite)
        run: |
          cd cpanel
          npm run build

      - name: Sincronizar Capacitor
        run: |
          cd cpanel
          npx cap sync android

      - name: Compilar APK sin firmar (Gradle)
        run: |
          cd cpanel/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Configurar Keystore
        run: |
          echo "${{ secrets.CPANEL_KEYSTORE_BASE64 }}" | base64 -d > cpanel-release.keystore

      - name: Firmar APK con apksigner
        run: |
          UNSIGNED_APK=$(find cpanel/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Firmando: $UNSIGNED_APK"
          
          apksigner sign \
            --ks cpanel-release.keystore \
            --ks-pass "pass:${{ secrets.CPANEL_KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.CPANEL_KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.CPANEL_KEY_PASSWORD }}" \
            --out cpanel-app-signed.apk \
            "$UNSIGNED_APK"

      - name: Subir APK Firmada
        uses: actions/upload-artifact@v4
        with:
          name: IDKFREE-CPANEL-APK
          path: cpanel-app-signed.apk
